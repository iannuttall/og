allowBuilds:
  '@biomejs/biome': true
  '@cloudflare/puppeteer': true
  esbuild: true
  sharp: true
  workerd: true

# Security overrides for transitive dev/tooling deps that upstream pins below
# patched releases. @puppeteer/browsers is Node-only (local browser downloads)
# and never bundled into the Worker; removing it drops unpatched extract-zip
# and basic-ftp.
overrides:
  '@puppeteer/browsers': '-'
  sharp: ^0.35.5
  undici: ^7.30.1
  zod: ^4.6.6
